name: Deploy (GitHub Pages + Hugging Face)

# 1 回だけビルドし、同じ成果物を GitHub Pages と Hugging Face Spaces の両方へ公開する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REPO_PATH: /FDE-AI-Knowledge-Base
  SITE_URL: https://zixuniaowu.github.io/FDE-AI-Knowledge-Base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pages 用（basePath あり）
      - name: Build static site for GitHub Pages
        run: pnpm build:web
        env:
          FDE_BASE_PATH: ${{ env.REPO_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ env.REPO_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

      # HF Spaces はルート配信のため basePath なしで再出力（同じジョブ・同じ依存）
      - name: Build static site for Hugging Face (no basePath)
        run: |
          rm -rf apps/web/out
          pnpm build:web
          cp scripts/hf-space-readme.md apps/web/out/README.md
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: hf-site
          path: apps/web/out

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-hf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: hf-site
          path: apps/web/out

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: jackywangsh/fde-kb
        run: |
          pip install -U huggingface_hub
          python3 scripts/deploy-hf.py
